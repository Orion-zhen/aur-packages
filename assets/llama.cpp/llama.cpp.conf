# The packaged service runs as the unprivileged `llamacpp` user. It remains
# inactive while LLAMA_ARGS is empty, so enabling the unit cannot accidentally
# expose an unauthenticated model router.
#
# Put service-owned models under /var/lib/llama.cpp. Downloads and runtime
# sockets use /var/cache/llama.cpp and /run/llama.cpp respectively. To use a
# model elsewhere, grant `llamacpp` read access and add a systemd drop-in if the
# path is below /home, which the packaged sandbox hides.
#
# For TCP, prefer a key file readable by root and the llamacpp group instead of
# putting the secret in this world-readable environment file:
#   install -Dm640 -o root -g llamacpp api-key /etc/llama.cpp/api-key
#   LLAMA_ARGS="--model /var/lib/llama.cpp/model.gguf --host 127.0.0.1 --cors-origins localhost --api-key-file /etc/llama.cpp/api-key"
#
# For a reverse proxy, add its user to the llamacpp group and bind a Unix socket:
#   LLAMA_ARGS="--model /var/lib/llama.cpp/model.gguf --host /run/llama.cpp/llama.sock"
LLAMA_ARGS=""
